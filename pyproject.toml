[project]
name = "photo-group-picker"
version = "0.1.0"
description = "Local scene grouping and photo shortlisting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2.3", "opencv-python-headless>=4.8,<4.12", "Pillow>=10,<12"]

[project.scripts]
photo-group-picker = "photo_group_picker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_group_picker"]
